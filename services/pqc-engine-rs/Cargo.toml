[package]
name = "pqc-engine-rs"
version = "0.1.0"
edition = "2021"
description = "Post-Quantum Cryptography engine for Autolytiq - NIST FIPS 203/204 compliant"
license = "MIT"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Post-Quantum Cryptography - NIST standardized algorithms
# ML-KEM (Kyber) - FIPS 203 for key encapsulation
# ML-DSA (Dilithium) - FIPS 204 for digital signatures
pqcrypto-kyber = "0.8"
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"

# Classical cryptography for hybrid mode
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"

# Key derivation
sha3 = "0.10"
hkdf = "0.12"

# Core utilities
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
getrandom = { version = "0.2", features = ["js"] }

# WASM bindings
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

# Encoding
base64 = "0.21"
hex = "0.4"

[features]
default = ["console_error_panic_hook"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols
