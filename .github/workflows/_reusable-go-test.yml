name: Go Service Test (Reusable)

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: 'Name of the Go service to test'
      working-directory:
        required: true
        type: string
        description: 'Working directory for the service'
      go-version:
        required: false
        type: string
        default: '1.21'
        description: 'Go version to use'
      run-integration-tests:
        required: false
        type: boolean
        default: false
        description: 'Whether to run integration tests'
    outputs:
      coverage:
        description: 'Test coverage percentage'
        value: ${{ jobs.test.outputs.coverage }}

jobs:
  test:
    name: Test ${{ inputs.service-name }}
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Download dependencies
        working-directory: ${{ inputs.working-directory }}
        run: go mod download

      - name: Run unit tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          echo "✅ Unit tests passed for ${{ inputs.service-name }}"

      - name: Calculate coverage
        id: coverage
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
            echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "📊 Test coverage: $COVERAGE%"

            # Fail if coverage is below 50%
            if (( $(echo "$COVERAGE < 50" | bc -l) )); then
              echo "❌ Coverage is below 50%: $COVERAGE%"
              exit 1
            fi
          else
            echo "percentage=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ${{ inputs.working-directory }}/coverage.out
          flags: ${{ inputs.service-name }}
          fail_ci_if_error: false

      - name: Run integration tests
        if: inputs.run-integration-tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -d "integration" ]; then
            go test -v ./integration/...
            echo "✅ Integration tests passed for ${{ inputs.service-name }}"
          else
            echo "ℹ️ No integration tests found"
          fi
